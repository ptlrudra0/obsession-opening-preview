const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};

function flick(t){const k=Math.floor(t*11);let v=.04*Math.sin(t*37)+(hash(k)>.86?-.22*hash(k+9):0)+(hash(Math.floor(t*3))>.9?-.18:0);return 1+v}
// prints: [img,w,h,x,y,rot]
const CL=[['p36',360,203,-640,-250,-4],['p31',540,304,500,-210,2.5],['p53',380,214,-600,215,3],['p25',460,259,560,200,-3],['p23',820,461,-130,-30,-1.6]];
function build(el){el.innerHTML='';CL.forEach(([n,w,h,x,y,r])=>{const d=document.createElement('div');d.className='print';d.style.cssText=`width:${w+18}px;height:${h+18}px;left:${x-w/2-9}px;top:${y-h/2-9}px;transform:rotate(${r}deg)`;const i=new Image();i.src=IM[n];d.appendChild(i);el.appendChild(d)})}
build($('cd'));build($('cli'));
// single full prints for variant C flashes
const FL=[['p35',1100,619,-40,10,-2],['p36',1000,563,60,-10,2.5],['p54',1000,563,-60,20,-1.5],['p28',1100,619,30,0,2]];
FL.forEach(([n,w,h,x,y,r])=>{const d=document.createElement('div');d.className='print';d.style.cssText=`width:${w+18}px;height:${h+18}px;left:${960+x-w/2-9}px;top:${540+y-h/2-9}px;transform:rotate(${r}deg);opacity:0`;d.dataset.k=n;const i=new Image();i.src=IM[n];d.appendChild(i);$('fl').appendChild(d)});

const M={a:{dur:17,name:'A  photoshoot, pull back, light moves to the title'},
         b:{dur:17,name:'B  seen through frosted glass, wiped clear by the light'},
         c:{dur:15,name:'C  camera flashes in the dark, then pull back'},
         d:{dur:17,name:'D  light from the speaker corner sweeps across'}};
let V='a';
function maskLit(el,css){el.style.webkitMaskImage=el.style.maskImage=css}
function radial(x,y,rx,ry,I){return `radial-gradient(ellipse ${rx}px ${ry}px at ${x}px ${y}px,rgba(0,0,0,${I}) 0%,rgba(0,0,0,${I*.62}) 38%,rgba(0,0,0,${I*.18}) 72%,transparent 100%)`}

const BC=document.createElement('canvas');BC.width=480;BC.height=270;const bx=BC.getContext('2d');
function beamURL(ang,w,I,reach){bx.clearRect(0,0,480,270);if(I<=0.002)return `url(${BC.toDataURL()})`;
 const a=(90-ang)*Math.PI/180, hw=w*Math.PI/180, ox=0, oy=270, R=reach/4;
 const g=bx.createRadialGradient(ox,oy,0,ox,oy,R);g.addColorStop(0,`rgba(0,0,0,${I})`);g.addColorStop(.55,`rgba(0,0,0,${I*.6})`);g.addColorStop(1,'rgba(0,0,0,0)');
 bx.filter='blur(7px)';bx.fillStyle=g;bx.beginPath();bx.moveTo(ox,oy);bx.arc(ox,oy,R*1.1,-(a+hw),-(a-hw));bx.closePath();bx.fill();bx.filter='none';
 return `url(${BC.toDataURL()})`}
function beam(ang,w,I){ // from bottom-left corner of stage
  return `conic-gradient(from ${ang-w}deg at 0px 1080px,transparent 0deg,rgba(0,0,0,${I}) ${w}deg,transparent ${2*w}deg,transparent 360deg)`}

function render(t){
 const m=M[V];
 let s,fx,fy,bd,bl,lx,ly,rx,ry,I,tg,tl,tx,ty,tr,fa=0,flArr=null,useBeam=false,ang=0,bw=0;
 const T=t;
 if(V==='a'){
  // 0-2.2 lamp comes up on the group, only the middle is lit. 2.2-7 slow push + drift. 7-12 pull back. 12-16 light travels to the title.
  const zi=ez(seg(T,6.6,12.4));
  s=lerp(2.25+.06*seg(T,0,7),.98,zi); fx=lerp(-130+14*seg(T,0,7),0,zi); fy=lerp(-30,0,zi);
  bd=lerp(0,3.2,seg(T,8,12)); bl=bd;
  const up=eo(seg(T,.4,2.6));
  const sweep=ez(seg(T,2.4,6.4)), tr2=ez(seg(T,12,15.4));
  const photoX=lerp(960-70,960+70,sweep), photoY=lerp(520,500,sweep);
  const px=lerp(photoX,960,tr2*0+ (T>9? 0:0)), // photo light stays until it travels
  lxp=photoX, lyp=photoY;
  const lightPhoto=1-seg(T,11.6,14.2);
  I=up*lightPhoto*(1-.25*seg(T,7,11));
  lx=lerp(lxp,960,seg(T,10,12)*0); ly=lyp;
  rx=lerp(300,820,seg(T,6.6,11.5)); ry=lerp(210,520,seg(T,6.6,11.5));
  tg=.08*seg(T,8.5,11.5); // ghost of title shows as the camera backs off
  tl=eo(seg(T,12.2,15))*flick(T); tx=lerp(240,960,tr2); ty=560; tr=lerp(520,1000,tr2);
 }
 if(V==='b'){
  const zi=ez(seg(T,6.4,12.2));
  s=lerp(2.1+.05*seg(T,0,6),.98,zi); fx=lerp(-110,0,zi); fy=lerp(-20,0,zi);
  bd=lerp(20,3.2,ez(seg(T,7,13))); bl=lerp(0,3.2,seg(T,8,12));
  const up=eo(seg(T,.3,2.4));
  // wiped patch drifts like a hand wiping fog, then travels onto the title
  const w=T<12?seg(T,0,12):1;
  const wx=960+Math.sin(T*.55)*190*(1-seg(T,10,12))+(-60)*(1-w), wy=520+Math.cos(T*.43)*95*(1-seg(T,10,12));
  const lightPhoto=1-seg(T,11.4,13.6);
  lx=wx; ly=wy; I=up*lightPhoto;
  const grow=seg(T,1,3);
  rx=lerp(220,300,grow)+lerp(0,520,seg(T,6.4,11.5)); ry=lerp(170,230,grow)+lerp(0,330,seg(T,6.4,11.5));
  tg=.1*seg(T,9,12); tl=eo(seg(T,12,14.8))*flick(T); const tr2=ez(seg(T,12,15.6)); tx=lerp(300,960,tr2); ty=560; tr=lerp(520,1000,tr2);
 }
 if(V==='c'){
  // four flashes on single prints (each lasts about a second), then the group arrives with the last flash and the camera backs off
  const ts=[.9,2.5,4.1,5.7];
  flArr=FL.map((f,i)=>{const d=T-ts[i];if(d<0||d>1.8)return 0;const rise=clamp(d/.05);return rise*(Math.exp(-d/.16)*.95+.32*Math.exp(-d/.8))});
  fa=0; ts.forEach(x=>{const d=T-x;if(d>=0&&d<.5)fa=Math.max(fa,Math.exp(-d/.07)*.9)});
  const d7=T-7.3; if(d7>=0&&d7<.6)fa=Math.max(fa,Math.exp(-d7/.09));
  const zi=ez(seg(T,8,12.4));
  s=lerp(2.2,.98,zi); fx=lerp(-130,0,zi); fy=lerp(-30,0,zi);
  bd=lerp(0,3.2,seg(T,9,12)); bl=bd;
  const gi=T<7.3?0:(1+0)*(Math.exp(-(T-7.3)/.4)*.9+.5*eo(seg(T,7.3,8.5)));
  I=Math.min(1,gi)*(1-seg(T,11.2,13.4))*(T>7.3?1:0); lx=960; ly=520; rx=lerp(700,900,seg(T,8,12)); ry=lerp(420,560,seg(T,8,12));
  tg=.08*seg(T,9.5,12); tl=eo(seg(T,12.4,14.2))*flick(T); tx=960; ty=560; tr=1000;
  // hide cluster before the group arrives
  $('cd').parentElement.style.opacity=T<7.3?0:1; $('cli').parentElement.style.opacity=T<7.3?0:1;
 } else { $('cd').parentElement.style.opacity=1; $('cli').parentElement.style.opacity=1; }
 if(V==='d'){
  useBeam=true;
  const zi=ez(seg(T,7,12.4));
  s=lerp(1.9+.05*seg(T,0,7),.98,zi); fx=lerp(-110,0,zi); fy=lerp(-20,0,zi);
  bd=lerp(0,3.2,seg(T,8,12)); bl=bd;
  const up=eo(seg(T,.5,2.8));
  // beam angle (0 = straight up, clockwise). Starts angled at the group, travels toward the centre-right text band
  ang=lerp(52,67,ez(seg(T,2.5,7)))+lerp(0,-2,seg(T,7,12));
  bw=lerp(8,13,seg(T,6,12));
  const lightPhoto=1-seg(T,11.8,14.2);
  I=up*lightPhoto*flick(T);
  tg=.08*seg(T,9,12); tl=0;
  // title lit by the same beam: reuse beam on title, angle toward 63 deg
  tl=eo(seg(T,11.6,14.6))*flick(T);
 }
 // camera
 const tf=`translate(${-fx*s}px,${-fy*s}px) scale(${s})`;
 $('cd').style.transform=tf;$('cli').style.transform=tf;
 $('dim').style.filter=`brightness(${V==='d'?.1:.08}) saturate(.8) blur(${bd}px)`;
 $('lit').style.filter=`blur(${bl}px) brightness(${.92*flick(T)})`;
 // light masks
 if(useBeam){
  const l=$('lit');l.style.webkitMaskComposite='source-over';l.style.maskComposite='add';
  const u=beamURL(ang,bw,I,2000);l.style.webkitMaskImage=l.style.maskImage=u;l.style.webkitMaskSize=l.style.maskSize='100% 100%';
  const tt=$('tlit');tt.style.webkitMaskComposite='source-over';tt.style.maskComposite='add';
  const u2=beamURL(60,bw+10,tl,2900);tt.style.webkitMaskImage=tt.style.maskImage=u2;tt.style.webkitMaskSize=tt.style.maskSize='100% 100%';tt.style.opacity=1;
 } else {
  const l=$('lit');l.style.webkitMaskComposite='source-over';l.style.maskComposite='add';l.style.webkitMaskSize=l.style.maskSize='auto';maskLit(l,radial(lx,ly,rx,ry,clamp(I*flick(T),0,1)));
  const tt=$('tlit');tt.style.webkitMaskComposite='source-over';tt.style.maskComposite='add';tt.style.webkitMaskSize=tt.style.maskSize='auto';maskLit(tt,radial(tx,ty,tr,300,clamp(tl,0,1)));tt.style.opacity=1;
 }
 $('tghost').style.opacity=tg;
 $('tghost').style.transform=`scale(${lerp(1.05,1,seg(T,7,13))})`;$('tlit').style.transform=$('tghost').style.transform;
 // flashes
 const fl=$('fl');fl.style.opacity=1;
 [...fl.children].forEach((d,i)=>{const v=flArr?flArr[i]:0;d.style.opacity=clamp(v);d.querySelector('img').style.filter=`brightness(${.35+.8*clamp(v)}) contrast(1.05) saturate(.9)`});
 $('flash').style.opacity=fa*(V==='c'?.55:0);
 $('glass').style.opacity=V==='b'?1:(V==='a'?.7*seg(T,7,12):.5*seg(T,8,12));
 $('glass').style.transform=`translateX(${(T*8)%200-60}px)`;
 $('wall').style.opacity=1;
}
// preview player
let t0=performance.now(),playing=true,fixed=null;
function setV(v){V=v;t0=performance.now();document.querySelectorAll('#ui button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('name').textContent=M[v].name;location.hash=v}
function tick(){ if(fixed!==null){render(fixed)} else {const t=(performance.now()-t0)/1000;render(Math.min(t,M[V].dur));}
 requestAnimationFrame(tick)}
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);$('fit').style.transform=`scale(${k}) translate(-960px,-540px)`}
addEventListener('resize',fit);fit();
document.querySelectorAll('#ui button[data-v]').forEach(b=>b.onclick=()=>setV(b.dataset.v));
$('rp').onclick=()=>{t0=performance.now()};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if('abcd'.includes(k)&&k.length===1)setV(k);if(k==='1')setV('a');if(k==='2')setV('b');if(k==='3')setV('c');if(k==='4')setV('d');if(k==='r'||k===' ')t0=performance.now();if(k==='h')document.body.classList.toggle('h')});
window.seek=(v,t)=>{V=v;fixed=t;$('name').textContent='';document.body.classList.add('h');render(t)};
const h=location.hash.replace('#','');setV('abcd'.includes(h)&&h?h:'a');
setTimeout(()=>$('name').style.opacity=0,5000);
tick();
</script></body></html>
